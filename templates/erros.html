{% extends "base.html" %}

{% block title %}Erros de Validação{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="alert alert-danger shadow-sm" role="alert">
            <h4 class="alert-heading mb-3"><i class="bi bi-exclamation-triangle-fill"></i> Ops! A validação falhou:</h4>
            <hr>
            <ul class="mb-0">
                {% for erro in erros %}
                    <li>{{ erro }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="mt-4">
            <button onclick="window.history.back()" class="btn btn-secondary">Voltar ao Formulário</button>
        </div>
    </div>
</div>
{% endblock %}
