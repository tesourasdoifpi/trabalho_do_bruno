{% extends "base.html" %}

{% block title %}Nova Operação{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card card-custom">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Cadastrar Nova Operação</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('cadastrar_operacao') }}" method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="data" class="form-label">Data da Operação</label>
                            <input type="date" class="form-control" id="data" name="data" required>
                        </div>
                        <div class="col-md-6">
                            <label for="ativo" class="form-label">Código do Ativo</label>
                            <input type="text" class="form-control" id="ativo" name="ativo" placeholder="Ex: PETR4" maxlength="6" style="text-transform: uppercase;" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="quantidade" class="form-label">Quantidade</label>
                            <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label for="valor_unitario" class="form-label">Valor Unit. (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="valor_unitario" name="valor_unitario" min="0.01" required>
                        </div>
                        <div class="col-md-4">
                            <label for="tipo_operacao" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo_operacao" name="tipo_operacao" required>
                                <option value="" selected disabled>Selecione...</option>
                                <option value="1">Compra</option>
                                <option value="2">Venda</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="{{ url_for('listar_todas_operacoes') }}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Operação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
